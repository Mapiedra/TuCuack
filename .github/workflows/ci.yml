name: CI

# Comprobaciones rápidas en cada push y pull request: que el código parsea y que
# el sheet de sprites se puede regenerar y pasa su propia verificación
# (alineación de los frames, cambios de tamaño y recortes).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "OK"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pillow numpy

      - name: Rebuild sprite sheet
        run: python tools/pack_sprites.py

      - name: Fail if the sprite sheet is out of date
        run: |
          if ! git diff --quiet -- assets/sprites/duck.png assets/sprites/duck.json; then
            echo "El sheet generado no coincide con el versionado."
            echo "Ejecuta 'npm run sprites' y commitea el resultado."
            exit 1
          fi
          echo "OK"
