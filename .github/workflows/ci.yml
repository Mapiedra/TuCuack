name: CI

# Comprobaciones rápidas en cada push y pull request: que el código parsea y que
# el sheet de sprites se regenera correctamente.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          find src tools -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "OK"

      # Sólo las de producción: aquí no se compila nada de Electron.
      - name: Install dependencies
        run: npm ci --omit=dev

      # El ensamblado de la extensión es un paso fácil de romper sin darse cuenta
      # —basta mover un fichero de sitio— y sólo se nota al publicar. Comprobarlo
      # aquí cuesta segundos.
      - name: Ensamblar la extensión
        run: npm run ext

      - name: Comprobar que la extensión queda completa
        run: |
          for f in manifest.json sw.js content.js panel.html boot.js \
                   core/app.js core/game/minijuegos/index.js \
                   core/game/minijuegos/tresEnRaya.js \
                   core/game/minijuegos/laMascotaDice.js \
                   core/game/minijuegos/memoria.js \
                   core/game/minijuegos/rondaSimultanea.js \
                   core/game/minijuegos/paleta.js \
                   core/game/minijuegos/punteria.js \
                   core/game/minijuegos/agujero.js \
                   core/game/minijuegos/escenario.js \
                   core/game/salas.js core/game/protocolo.js \
                   core/game/broma.js \
                   core/game/peaje.js \
                   vendor/supabase.js assets/sprites/index.json INSTALAR.txt; do
            if [ ! -f "dist/extension/$f" ]; then
              echo "::error::Falta $f en la extensión ensamblada."
              exit 1
            fi
          done
          node -e "
            const m = require('./dist/extension/manifest.json');
            const v = require('./package.json').version;
            if (m.version !== v) {
              console.error('::error::El manifest dice ' + m.version + ' y package.json ' + v);
              process.exit(1);
            }
            if (!m.key) {
              console.error('::error::El manifest no lleva key: el ID cambiaría en cada máquina.');
              process.exit(1);
            }
          "
          echo "OK"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pillow numpy

      # El propio script verifica que ninguna animación salte, cambie de tamaño
      # ni se corte, y sale con error si algo no cuadra.
      - name: Rebuild sprite sheet
        run: python tools/pack_sprites.py

      # Sólo se comparan los metadatos: el PNG no es reproducible byte a byte
      # entre plataformas (cada versión de Pillow comprime y remuestrea distinto),
      # mientras que duck.json describe la estructura y no depende de eso. Basta
      # para detectar que alguien tocó el generador sin regenerar el sheet.
      - name: Check sprite metadata is up to date
        run: |
          if ! git diff --quiet -- 'assets/sprites/duck-*.json'; then
            echo "::error::Los metadatos de algún diseño no coinciden con lo versionado."
            echo "Ejecuta 'npm run sprites' y commitea el resultado."
            git diff --stat -- 'assets/sprites/duck-*.json'
            exit 1
          fi
          echo "OK"
