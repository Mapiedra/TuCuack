name: Release

# Se dispara al subir un tag de versión (p. ej. v0.1.0). Compila en Windows y en
# macOS y publica los instaladores, junto con latest.yml / latest-mac.yml, en un
# GitHub Release: ese Release es el feed que electron-updater consulta para
# autoactualizarse.
#
# Para publicar una versión:
#   1. sube "version" en package.json y añade la entrada en CHANGELOG.md
#   2. git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write         # necesario para crear el Release y subir los binarios

jobs:
  # El Release se crea aquí, una sola vez, antes de compilar. Si lo crearan los
  # jobs de compilación, los dos intentarían crearlo a la vez y el que perdiera
  # la carrera fallaría con "already_exists" sin subir sus binarios: es lo que
  # dejó la 0.3.1 sin instalador de macOS. Con el Release ya creado, cada job se
  # limita a subir sus ficheros.
  preparar:
    name: Preparar el Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # El tag sale de package.json, que es de donde lo saca también
      # electron-builder: así no pueden discrepar.
      - name: Calcular el tag
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Crear el Release si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El Release $TAG ya existe; se reutiliza."
            exit 0
          fi
          node tools/notas-release.js "$TAG" > notas.md
          gh release create "$TAG" --title "TuCuack ${TAG#v}" --notes-file notas.md

  release:
    needs: preparar

    strategy:
      fail-fast: false    # que un fallo en un sistema no cancele el otro
      matrix:
        include:
          - os: windows-latest
            nombre: Windows
          - os: macos-latest
            nombre: macOS

    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Credenciales del chat. Se generan aquí desde los secrets del repositorio
      # para no versionarlas; si no están definidas, se compila sin chat.
      # Se hace con node para que valga igual en Windows y en macOS.
      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/write-supabase-config.js

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sin certificado de Apple no se firma ni se notariza; evita que
          # electron-builder intente firmar y falle.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Por defecto electron-builder se niega a subir a un Release publicado
          # hace más de dos horas. Eso impide relanzar a mano un job que falló,
          # que es justo cuando más falta hace.
          EP_GH_IGNORE_TIME: true
