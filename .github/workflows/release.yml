name: Release

# Se dispara al subir un tag de versión (p. ej. v0.1.0). Compila el instalador de
# Windows y los paquetes de Linux, y publica el Release con latest.yml y
# latest-linux.yml, que son los feeds que electron-updater consulta para
# autoactualizarse. Además empaqueta la extensión de Chrome.
#
# La app de escritorio es de Windows y de Linux; se compila cada una en su propio
# runner porque electron-builder empaqueta para el sistema en el que corre. En lo
# demás —macOS, un móvil, un ordenador ajeno— el pato vive en la extensión de
# Chrome, que se empaqueta aquí mismo y no depende del sistema operativo: el mismo
# núcleo, el mismo canal de chat y los mismos patos.
#
# Para publicar una versión:
#   1. sube "version" en package.json y añade la entrada en CHANGELOG.md
#   2. git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write         # necesario para crear el Release y subir los binarios

jobs:
  # El Release se crea aquí, una sola vez, antes de nada. Si lo crearan los jobs
  # que publican, los tres intentarían crearlo a la vez y los que perdieran la
  # carrera fallarían con "already_exists" sin subir sus ficheros: es lo que dejó
  # la 0.3.1 a medias. Con el Release ya creado, cada job se limita a subir lo
  # suyo — el instalador de Windows, los paquetes de Linux y el zip de la
  # extensión.
  preparar:
    name: Preparar el Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # El tag sale de package.json, que es de donde lo saca también
      # electron-builder: así no pueden discrepar.
      - name: Calcular el tag
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Crear el Release si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El Release $TAG ya existe; se reutiliza."
            exit 0
          fi
          node tools/notas-release.js "$TAG" > notas.md
          gh release create "$TAG" --title "TuCuack ${TAG#v}" --notes-file notas.md

  release:
    needs: preparar
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Credenciales del chat. Se generan aquí desde los secrets del repositorio
      # para no versionarlas; si no están definidas, se compila sin chat.
      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/write-supabase-config.js

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Por defecto electron-builder se niega a subir a un Release publicado
          # hace más de dos horas. Eso impide relanzar a mano un job que falló,
          # que es justo cuando más falta hace.
          EP_GH_IGNORE_TIME: true

  # Los dos formatos que se publican para Linux (ver `build.linux` en
  # package.json):
  #
  #   - `.deb` para Ubuntu y derivadas, que es donde va a estar casi todo el
  #     mundo. Se instala con el gestor de paquetes, que además deja el sandbox
  #     de Chromium con los permisos que pide, y lo actualiza apt.
  #   - `.AppImage` para el resto, que es el único formato que electron-updater
  #     sabe reemplazar solo (ver `initUpdater`), y por eso el único que se
  #     autoactualiza. De ahí sale `latest-linux.yml`.
  linux:
    needs: preparar
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Las mismas credenciales del chat que en Windows: los patos comparten
      # canal sin importar de dónde salga cada uno.
      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/write-supabase-config.js

      - name: Build and publish
        run: npm run release -- --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: true

  # La extensión no se compila: se ensambla copiando el núcleo, su carcasa y los
  # sprites en una carpeta, y esa carpeta se comprime. Se instala en modo
  # desarrollador y se actualiza descomprimiendo encima (ver INSTALAR.txt).
  extension:
    needs: preparar
    name: Extensión de Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Sólo hace falta supabase-js, que va en dependencies: el service worker
      # lleva dentro su bundle, porque Manifest V3 no permite cargar código de
      # fuera. Sin las de desarrollo nos ahorramos descargar Electron entero para
      # un trabajo que es copiar ficheros.
      - name: Install dependencies
        run: npm ci --omit=dev

      # Las mismas credenciales que el escritorio: así los patos de extensión y
      # los de escritorio comparten el canal de chat.
      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/write-supabase-config.js

      - name: Ensamblar la extensión
        run: npm run ext

      - name: Comprimir
        run: |
          TAG="${{ needs.preparar.outputs.tag }}"
          cd dist/extension
          zip -r "../TuCuack-extension-${TAG#v}.zip" .
          cd ..
          unzip -l "TuCuack-extension-${TAG#v}.zip" | tail -1

      - name: Subir al Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.preparar.outputs.tag }}"
          gh release upload "$TAG" "dist/TuCuack-extension-${TAG#v}.zip" --clobber
